<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Смена пароля прототипа</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .out { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; word-break: break-all; background: var(--bg); padding: 12px; border-radius: var(--r-sm); }
    .steps-text { font-size: 14px; color: var(--text-2); padding-left: 18px; margin: 0; display: flex; flex-direction: column; gap: 4px; }
    code { background: var(--bg); padding: 1px 6px; border-radius: 6px; }
  </style>
</head>
<body data-auth="tool">
  <!-- Служебная страница: не публикуйте её вместе с прототипом (или удалите после смены пароля) -->
  <div class="gate" id="gate">
    <form class="gate__card" id="f" novalidate>
      <h1 class="gate__title">Новый пароль</h1>
      <p class="gate__sub">Страница считает хеш пароля у вас в браузере. Пароль никуда не отправляется.</p>
      <label class="gate__label" for="p1">Пароль</label>
      <div class="gate__field"><input type="text" id="p1" autocomplete="new-password"></div>
      <label class="gate__label" for="p2">Повторите пароль</label>
      <div class="gate__field"><input type="text" id="p2" autocomplete="new-password"></div>
      <p class="gate__error" id="e" role="alert" hidden></p>
      <button class="btn btn--primary btn--block" type="submit">Получить хеш</button>
      <div id="res" hidden>
        <p class="gate__label">Скопируйте строку:</p>
        <p class="out" id="hash"></p>
        <button class="btn btn--secondary btn--block" type="button" id="copy">Скопировать</button>
        <ol class="steps-text">
          <li>Откройте файл <code>auth.js</code>.</li>
          <li>Замените значение <code>PASSWORD_HASH</code> на скопированную строку.</li>
          <li>Сохраните файл и выложите прототип заново.</li>
        </ol>
      </div>
    </form>
  </div>
  <script src="auth.js"></script>
  <script>
    (function () {
      var f = document.getElementById("f"), e = document.getElementById("e");
      f.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var a = document.getElementById("p1").value, b = document.getElementById("p2").value;
        e.hidden = true;
        if (a.length < 8) { e.textContent = "Пароль должен быть не короче 8 символов."; e.hidden = false; return; }
        if (a !== b) { e.textContent = "Пароли не совпадают."; e.hidden = false; return; }
        document.getElementById("hash").textContent = window.__refiHash(a);
        document.getElementById("res").hidden = false;
      });
      document.getElementById("copy").addEventListener("click", function () {
        var t = document.getElementById("hash").textContent, btn = this;
        var done = function () { btn.textContent = "Скопировано"; };
        if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, function () { select(); });
        else select();
        function select() { var r = document.createRange(); r.selectNodeContents(document.getElementById("hash")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Выделено — нажмите Ctrl+C"; }
      });
    })();
  </script>
</body>
</html>
